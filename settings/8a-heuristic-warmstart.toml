# Main evaluation, row 8a: Heuristic warmstart.
# Overrides of settings/default.toml.
[SOLVER]
INCLUDE_WARMSTART_TIME_LIMIT = true

[WARMSTARTING]
ENABLED = true
WARMSTART_METHOD = ":rscots_sequential"

[WARMSTARTING.RSCOTS]
TIME_LIMIT = 1800
STAGE_TIME_LIMIT = 1800
SWITCHABLE_BRANCHES_LIMIT_MODE = ":abs_num"
N_SW_BR_ABS = 16

[WARMSTARTING.RSCOTS.WEIGHTS]
FULL = 0.0
ADMITTANCE_SECANT = 1.0

[WARMSTARTING.RSCOTS.HEUR]
INITIALLY_OPEN_FIRST = true
