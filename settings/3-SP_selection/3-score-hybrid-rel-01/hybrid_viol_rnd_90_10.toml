# Experiment 3 / Stage 3 — SCORE hybrid viol_rnd (0.9, 0.1)
# Combines violation score with a uniformly random component to inject exploration.
[BENDERS]
    [BENDERS.PARTIAL]
        ENABLED                         = true
        SORTING_MODE                    = ":SCORE"
        SCORE_DECAY                     = 0.9      # best from Stages 2/3
        [BENDERS.PARTIAL.LIMITS]
            STOP_AFTER_N_HITS_REL       = 0.10     # best from Stage 1
        [BENDERS.PARTIAL.SCORE]
            load                        = 0.0
            sw_score                    = 0.0
            violation_per_cut           = 0.9
            reliability                 = 0.0
            total_share                 = 0.0
            n_since_call                = 0.01
            random                      = 0.1

    [BENDERS.CUTS]
        [BENDERS.CUTS.SELECTION]
            ENABLED                     = false                  # enable cut selection