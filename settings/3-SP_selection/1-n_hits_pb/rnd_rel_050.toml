# Experiment 3 / Stage 1 — RND + STOP_AFTER_N_HITS_REL = 0.01
[BENDERS]
    [BENDERS.PARTIAL]
        ENABLED                         = true
        SORTING_MODE                    = ":RND"

        [BENDERS.PARTIAL.LIMITS]
            STOP_AFTER_TIME             = "Inf"                  # time limit for solving the subproblem (in seconds)
            STOP_AFTER_N_HITS           = "Inf"                 # number of hits before stopping
            STOP_AFTER_N_HITS_REL       = 0.50                  # fraction of hits relative to total number of SPs before stopping
            STOP_AFTER_N_MISSES         = "Inf"                 # number of misses before stopping (after at least one cut was generated)
            STOP_AFTER_N_FEAS_CUTS      = "Inf"                  # number of feasibility cuts before stopping
            STOP_ON_PB                  = true                  # stop if the current primal bound is better than the master solution will be after adding these cuts
            STOP_ON_PB_REL_BUFFER       = 0.1                   # stop if current master solution value * (1 - rel_tol) is worse than primal bound
            MIN_PRIO                    = 0.0    
            
    [BENDERS.CUTS]
        [BENDERS.CUTS.SELECTION]
            ENABLED                     = false                  # enable cut selection
               # minimum subproblem priority (after at least one cut was generated)
