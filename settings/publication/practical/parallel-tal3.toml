# Overrides of settings/default.toml. Original settings are identified in ../origins.tsv.
[SOLVER]
INCLUDE_WARMSTART_TIME_LIMIT = true
SOLVING_TIME_LIMIT = 21600

[SOLVER.MULTITHREADING]
N_THREADS_MIP_MP = 2

[WARMSTARTING]
ENABLED = true
WARMSTART_METHOD = ":rscots_sequential"

[WARMSTARTING.RSCOTS]
MIP_GAP = 0.0
HELPER_MIP_GAP = 0.0
HELPER_DISABLE_OBJECTIVE_STOP = true
TIME_LIMIT = 21600
STAGE_TIME_LIMIT = 1800
SWITCHABLE_BRANCHES_LIMIT_MODE = ":abs_num"
N_SW_BR_ABS = 16
BEST_OBJ_STOP_FRACTION = 0.0

[WARMSTARTING.RSCOTS.WEIGHTS]
FULL = 0.0
ADMITTANCE_SECANT = 1.0

[WARMSTARTING.RSCOTS.HEUR]
INITIALLY_OPEN_FIRST = true

[LIMITS.BRANCH]
TAL_TIMESTEP = 3
