[BENDERS]
    SUBPROBLEM_SOLVER_TYPE              = "LinEqSysSolver"      # Type of subproblem solver {LinEqSysSolver, FullLPSolver, LinEqSysRfSolver}
    BASE_PF_IN_MASTER                   = false                 # have base power flow in master problem (not supported in nested Benders)

    [BENDERS.CUTS]
        [BENDERS.CUTS.SELECTION]
            ENABLED                     = false                  # enable cut selection

    # Benders limits for partial subproblem solving
    [BENDERS.PARTIAL]
        ENABLED                         = false                  # partial subproblem solving