# Experiment 9 — Nested Benders Grid Search — base PF in intermediate problem
APPLICATION                             = "DC_SCOTS_TIME_SLACK_BENDERS_NESTED"

[BENDERS]
    SUBPROBLEM_SOLVER_TYPE              = "LinEqSysRfSolver"

    [BENDERS.CUTS]
        [BENDERS.CUTS.SELECTION]
            ENABLED                     = false

    [BENDERS.PARTIAL]
        ENABLED                         = false

    [BENDERS.NESTED]
        BASE_PF_IN_INTERMEDIATE         = true
        NO_CHANGE_STOP                  = true
        CUT_POOL_SIZE                   = 10000
