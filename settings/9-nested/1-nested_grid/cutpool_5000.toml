# Experiment 9 — Nested Benders Grid Search — large intermediate cut pool (5000)
APPLICATION                             = "DC_SCOTS_TIME_SLACK_BENDERS_NESTED"

[BENDERS]
    SUBPROBLEM_SOLVER_TYPE              = "LinEqSysRfSolver"

    [BENDERS.CUTS]
        [BENDERS.CUTS.SELECTION]
            ENABLED                     = false

    [BENDERS.PARTIAL]
        ENABLED                         = false

    [BENDERS.NESTED]
        CUT_POOL_SIZE                   = 5000
