# Experiment 9 — Nested Benders Grid Search — stop intermediate iter on no-change
APPLICATION                             = "DC_SCOTS_TIME_SLACK_BENDERS_NESTED"

[BENDERS]
    SUBPROBLEM_SOLVER_TYPE              = "LinEqSysRfSolver"

    [BENDERS.CUTS]
        [BENDERS.CUTS.SELECTION]
            ENABLED                     = false

    [BENDERS.PARTIAL]
        ENABLED                         = false

    [BENDERS.NESTED]
        NO_CHANGE_STOP                  = true
