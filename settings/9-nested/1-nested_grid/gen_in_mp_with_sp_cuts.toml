# Experiment 9 — Nested Benders Grid Search — gen in MP + SP cuts added to MP
# NOTE: ADD_SP_CUTS requires GENERATION_IN_MP = true (assertion in source).
APPLICATION                             = "DC_SCOTS_TIME_SLACK_BENDERS_NESTED"

[BENDERS]
    SUBPROBLEM_SOLVER_TYPE              = "LinEqSysRfSolver"

    [BENDERS.CUTS]
        [BENDERS.CUTS.SELECTION]
            ENABLED                     = false

    [BENDERS.PARTIAL]
        ENABLED                         = false

    [BENDERS.NESTED]
        GENERATION_IN_MP                = true
        ADD_SP_CUTS                     = true
