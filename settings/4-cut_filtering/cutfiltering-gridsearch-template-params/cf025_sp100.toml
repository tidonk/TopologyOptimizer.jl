# Experiment 4 / Stage 1 — CF+SP hybrid grid (cf=0.25, sp=1.00)
# TODO: set score weights + decay to best from Exp. 3 (score*)
[BENDERS]
    [BENDERS.PARTIAL]
        ENABLED                         = true
        SORTING_MODE                    = ":SCORE"
        SCORE_DECAY                     = 0.9      # TODO: best from Exp. 3
        [BENDERS.PARTIAL.LIMITS]
            STOP_AFTER_N_HITS_REL       = 1.00
        [BENDERS.PARTIAL.SCORE]
            load                        = 0.0
            sw_score                    = 0.0
            violation_per_cut           = 0.5      # TODO: best from Exp. 3
            reliability                 = 0.5      # TODO: best from Exp. 3
            total_share                 = 0.0      # TODO: best from Exp. 3
            n_since_call                = 0.01

    [BENDERS.CUTS.SELECTION]
        ENABLED                         = true
        METHOD                          = ":DIVERSITY_AGG_HYB"

        [BENDERS.CUTS.SELECTION.DIVERSITY_AGG_HYB]
            NUM_CLUSTERS_MODE           = ":rel"
            NUM_CLUSTERS_REL_ALPHA      = 0.25
            AGG_HYB_MODE                = ":k_plus_1"
            REPRESENTATIVE_MODE         = ":max_violation"
            WEIGHTED_AGG                = true
            WEIGHTED_AGG_NORMALIZE      = true
